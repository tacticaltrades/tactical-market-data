# Updated Weekly Refresh Workflow with Phantom Stock Adjustment
# Runs every Friday at 4:05 PM EST
# Now includes automatic RS adjustment to match IBD's 8,000 stock universe

name: Weekly Stock Data Refresh with Phantom Adjustment

on:
  schedule:
    - cron: '5 21 * * 5'  # 4:05 PM EST = 21:05 UTC (Friday)
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh-and-adjust:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run weekly refresh (get all stocks)
      env:
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      run: |
        python process_stocks.py
    
    - name: Adjust RS rankings with phantom stocks
      run: |
        echo "Adding phantom stocks to match IBD's 8,000 stock universe..."
        python adjust_phantoms.py
        
        # Replace rankings.json with adjusted version
        cp rankings_adjusted.json rankings.json
        
        echo "✅ RS rankings adjusted successfully!"
    
    - name: Configure Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
    
    - name: Commit and push changes
      run: |
        git add rankings.json rankings_adjusted.json historical_data.json recent_ipos.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly data refresh with phantom-adjusted RS rankings - $(date +'%Y-%m-%d %H:%M:%S')" && git push)

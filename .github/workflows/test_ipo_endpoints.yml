name: Test IPO Endpoints (TEMPORARY)

on:
  workflow_dispatch:

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests

    - name: Test FMP IPO endpoints
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: python test_ipo_endpoints.py

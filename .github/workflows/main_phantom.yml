# Stock Rankings Pipeline
# Daily (Mon-Thu): Incremental price update — reuses profiles/earnings, ~30 min
# Weekly (Friday): Full rebuild — fresh profiles, earnings, market cap, ~2 hours

name: Daily Full Rebuild

on:
  schedule:
    - cron: '20 21 * * 1-4'  # 4:20 PM EST Mon-Thu (daily incremental)
    - cron: '20 21 * * 5'    # 4:20 PM EST Friday (weekly full rebuild)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: daily (price update only) or full (complete rebuild)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - full

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Determine run mode
      id: mode
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "mode=${{ github.event.inputs.mode || 'daily' }}" >> $GITHUB_OUTPUT
        elif [ "$(date -u +%u)" = "5" ]; then
          echo "mode=full" >> $GITHUB_OUTPUT
        else
          echo "mode=daily" >> $GITHUB_OUTPUT
        fi
        echo "Running in $(cat $GITHUB_OUTPUT | grep mode | cut -d= -f2) mode"

    - name: Run stock data pipeline
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: |
        python process_stocks.py --mode ${{ steps.mode.outputs.mode }}

    - name: Adjust RS rankings with phantom stocks (optional)
      run: |
        echo "Checking if phantom adjustment is needed..."
        STOCK_COUNT=$(python -c "import json; d=json.load(open('rankings.json')); print(d['total_stocks'])")
        echo "Total stocks from FMP: $STOCK_COUNT"

        if [ "$STOCK_COUNT" -lt 7000 ]; then
          echo "Stock count below 7,000 — applying phantom adjustment..."
          python adjust_phantom.py
          cp rankings_adjusted.json rankings.json
          echo "Phantom adjustment applied."
        else
          echo "Stock count >= 7,000 — skipping phantom adjustment."
        fi

    - name: Configure Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Commit and push changes
      run: |
        git add rankings.json recent_ipos.json
        [ -f rankings_adjusted.json ] && git add rankings_adjusted.json
        [ -f ipo_dates.json ] && git add ipo_dates.json
        [ -f industry_rank_history.json ] && git add industry_rank_history.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "${{ steps.mode.outputs.mode }} rebuild - $(date +'%Y-%m-%d %H:%M:%S')"
        # --autostash handles any remaining untracked files (e.g. historical_data.json)
        # without the empty-stash-pop failure the old chained command had.
        for i in 1 2 3; do
          if git pull --rebase --autostash origin main && git push; then
            echo "Push succeeded on attempt $i"
            exit 0
          fi
          echo "Push failed (attempt $i), retrying..."
          sleep 5
        done
        echo "Push failed after 3 attempts"
        exit 1

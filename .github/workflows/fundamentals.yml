# Weekly Fundamentals Rebuild
# Runs every Sunday at 8 PM EST (after weekly screener rebuild)
# Fetches fundamental financial data from FMP for all screener stocks
# Generates per-symbol JSON files in fundamentals/ directory

name: Weekly Fundamentals Rebuild

on:
  schedule:
    - cron: '0 1 * * 0'  # 8:00 PM EST Sunday = 01:00 UTC Monday
  workflow_dispatch:  # Allow manual trigger
    inputs:
      limit:
        description: 'Limit number of symbols to process (for testing)'
        required: false
        default: ''

jobs:
  fundamentals-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours — processing thousands of symbols

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run fundamentals pipeline
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        FUNDAMENTALS_LIMIT: ${{ github.event.inputs.limit }}
      run: |
        python process_fundamentals.py

    - name: Configure Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Commit and push changes
      run: |
        git add fundamentals/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Fundamentals rebuild - $(date +'%Y-%m-%d %H:%M:%S')" && git push)

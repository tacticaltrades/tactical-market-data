# Weekly Fundamentals Rebuild
# Runs every Sunday at 8 PM EST (after weekly screener rebuild)
# Smart skip: only re-processes stocks with stale data (>7 days old)
# First run processes all ~2400 stocks; subsequent runs only process ~200 with new earnings
# Set max_age=0 to force full rebuild of all stocks

name: Weekly Fundamentals Rebuild

on:
  schedule:
    - cron: '0 1 * * 0'  # 8:00 PM EST Sunday = 01:00 UTC Monday
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of symbols (for testing)'
        required: false
        default: ''
      max_age:
        description: 'Max age in days before re-processing (0 = force all)'
        required: false
        default: '7'
        type: choice
        options:
          - '7'
          - '3'
          - '0'

jobs:
  fundamentals-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run fundamentals pipeline
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        FUNDAMENTALS_LIMIT: ${{ github.event.inputs.limit }}
        FUNDAMENTALS_MAX_AGE_DAYS: ${{ github.event.inputs.max_age || '7' }}
      run: |
        python process_fundamentals.py

    - name: Configure Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Commit and push changes
      run: |
        git add fundamentals/
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Fundamentals rebuild - $(date +'%Y-%m-%d %H:%M:%S')"
        # Retry push with rebase up to 3 times in case of concurrent pushes
        for i in 1 2 3; do
          if git push; then
            echo "Push succeeded on attempt $i"
            exit 0
          fi
          echo "Push failed, pulling with rebase (attempt $i)..."
          git pull --rebase origin main
        done
        echo "Push failed after 3 attempts"
        exit 1
